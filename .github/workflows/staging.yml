name: Publicar staging sintetico

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Obter codigo aprovado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nunovinhas-creator/goal-roi
          ref: 3ba78e290526e7284877a3b8ac3879b23dc4a242
          path: source
          persist-credentials: false
          sparse-checkout: |
            audits/v7/snapshots
            ops/staging
            scripts/build_dashboard_snapshots.cjs
            docs/v6/v6-core.js
            docs/v6/v6-markets.js
            scangoal/prospective_protocol.json
          sparse-checkout-cone-mode: false

      - name: Verificar dependencias
        run: |
          node -e "require('./source/docs/v6/v6-core.js')"

      - name: Gerar dados sinteticos
        run: |
          python3 source/ops/staging/remote/prepare_site.py \
            --out "$RUNNER_TEMP/staging-site" \
            --revisions 6

      - name: Verificar integridade e isolamento
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "staging-site"
          m = json.loads((root / "SITE-MANIFEST.json").read_text())
          assert m["synthetic"] is True

          files = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*") if p.is_file()
          }

          assert files == set(m["files"]) | {"SITE-MANIFEST.json"}

          allowed = {
              "index.html", "probe.mjs", ".nojekyll",
              "SITE-MANIFEST.json",
              "client/client_integrity.mjs",
              "client/client_integrity_v2.mjs"
          }

          for p in files:
              path = root / p
              assert not path.is_symlink()
              assert p in allowed or p.startswith("snapshots/")

              if p in m["files"]:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == m["files"][p]

              if p.startswith("snapshots/"):
                  text = path.read_text().lower()
                  assert not any(x in text for x in (
                      "scangoal.com", "t.me/", "telegram.org"
                  ))

          print("Pacote sintetico verificado:", len(files), "ficheiros")
          PY

      - name: Preparar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/staging-site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar staging
        id: deployment
        uses: actions/deploy-pages@v4
